<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060b1c">
<title>영감의 우주</title>
<link rel="stylesheet" href="./site.css">
<link rel="stylesheet" href="./exhibit.css">
</head>
<body class="exhibit">
<header class="bar">
  <a class="brand" href="./"><span aria-hidden="true">✧</span> 영감의 우주</a>
  <nav aria-label="도구">
    <button type="button" id="camera" aria-pressed="false">카메라</button>
    <button type="button" id="mute" aria-pressed="false">소리 끄기</button>
  </nav>
</header>
<main>
  <section id="stage" class="stage" aria-label="영감의 우주 체험">
    <div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i>
      <video id="sky-video" class="sky-video" muted loop playsinline preload="auto"></video>
    </div>
    <canvas id="stars" class="layer" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>
    <div class="orbits" aria-hidden="true"><i></i><i></i><i></i></div>
    <svg id="sky-constellations" class="sky-constellations" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div id="art-layers" class="art-layers" aria-hidden="true"></div>
    <div id="floaters" class="floaters" aria-label="떠다니는 영감"></div>
    <div id="actors" class="actors" aria-hidden="true"></div>
    <div id="tray" class="tray" hidden>
      <div class="score" aria-live="polite">
        <span>우리의 우주</span>
        <strong><b id="count">00</b><small>/15</small></strong>
      </div>
      <div class="slots" id="slots" aria-label="공동 수집 칸"></div>
    </div>
    <canvas id="fx" class="layer fx" aria-hidden="true"></canvas>
    <p id="hint" class="hint" aria-hidden="true"></p>
    <aside class="erase-guide" aria-label="영감 지우는 방법">
      <span class="erase-guide-icon" aria-hidden="true">✋︎</span>
      <p class="erase-guide-hand"><strong>다른 영감으로 바꾸고 싶다면</strong><br>왼손을 펴서 내 칸 위에 잠시 대세요</p>
      <p class="erase-guide-mouse"><strong>다른 영감으로 바꾸고 싶다면</strong><br>아래에서 내가 모은 영감을 클릭하세요</p>
    </aside>
    <aside id="finish" class="finish" hidden>
      <p class="done">우리의 음악이 완성되었어요</p>
      <div id="qr" class="qr" role="img" aria-label="음악 다운로드 QR"></div>
      <p class="qr-cap">휴대폰 카메라로 찍어<br>음악을 받아 가세요</p>
      <div class="finish-actions">
        <button type="button" id="save">음원 저장</button>
        <button type="button" id="again">다시 시작</button>
      </div>
    </aside>
    <p id="perf" class="perf" hidden></p>
    <video id="camera-feed" class="camera-feed" muted playsinline></video>
  </section>
  <div class="workbench">
    <div class="players" id="players" aria-label="관람객 선택">
      <button data-player="0" type="button" aria-pressed="true">1번 · 레드</button>
      <button data-player="1" type="button" aria-pressed="false">2번 · 옐로</button>
      <button data-player="2" type="button" aria-pressed="false">3번 · 블루</button>
    </div>
    <p id="status" role="status">카메라 앞에 서면 우주인이 나타나요. 카메라가 없으면 화면을 클릭해 참여해요.</p>
    <button type="button" class="quiet" id="fullscreen">전체 화면</button>
  </div>
</main>
<footer>우주 사진 <a href="https://science.nasa.gov/asset/webb/cosmic-cliffs-in-the-carina-nebula-nircam-image/">NASA · ESA · CSA · STScI</a></footer>
<script src="./vendor/qrcode.js"></script>
<script type="module" src="./exhibit.js"></script>
</body>
</html>
